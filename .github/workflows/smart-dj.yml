name: Smart DJ frontend validation

on:
  push:
    branches: ["feat/smart-dj"]
  pull_request:

jobs:
  build-smart-dj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint:check
      - run: pnpm test:run
